spring:
  application:
    name: mydata-card-recommendation-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://mydata-card-recommendation.local}
      audience: ${JWT_AUDIENCE:mydata-card-recommendation-clients}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      key-id: ${JWT_KEY_ID:primary}
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
      private-key-base64: ${JWT_PRIVATE_KEY_BASE64}
